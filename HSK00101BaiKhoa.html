<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BÀI 1 - BÀI KHÓA</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:Arial,"Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg,#eef4ff,#f9fbff);
  display:flex; justify-content:center; color:#202124;
}
.app{width:min(900px,96vw); padding:20px 0 30px}
h1{text-align:center;margin:0 0 6px;font-size:32px}
.subtitle{text-align:center;color:#666;margin-bottom:14px;font-size:18px}
.progress{text-align:center;font-size:18px;color:#666;margin-bottom:12px}
.card-wrap{perspective:1200px; cursor:pointer}
.card{
  width:100%; height:600px; position:relative; transform-style:preserve-3d;
  transition:transform .55s ease;
}
.card.flipped{transform:rotateY(180deg)}
.face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:24px; background:white; box-shadow:0 12px 35px rgba(30,60,100,.15);
  display:flex; flex-direction:column; justify-content:space-between;
  padding:24px 28px; border:1px solid #e6eaf0; overflow:hidden;
}
.back{transform:rotateY(180deg)}

.card-content {
  flex: 1;
  overflow-y: auto;
  padding-right: 8px;
}

.context-title {
  font-weight: bold;
  margin-bottom: 16px;
  font-size: 20px;
  color: #2c3e50;
  line-height: 1.4;
  border-bottom: 2px solid #edf2f7;
  padding-bottom: 10px;
}
.dialogue-table {
  width: 100%;
  border-collapse: collapse;
}
.dialogue-table td {
  vertical-align: top;
  padding: 8px 0;
}
.speaker-col {
  width: 140px;
  color: #000000;
  font-weight: bold;
  font-size: 22px;
  white-space: nowrap;
}
.speaker-col-front {
  width: 140px;
  color: #718096;
  font-weight: bold;
  font-size: 28px;
  white-space: nowrap;
}
.speech-col {
  color: #e53e3e;
  font-weight: bold;
  font-size: 32px;
  line-height: 1.4;
}
.speech-col-back {
  color: #e53e3e;
  font-weight: bold;
  font-size: 24px;
  line-height: 1.4;
}
.pinyin-block {
  color: #718096;
  font-weight: bold;
  font-size: 20px;
  margin-top: 3px;
  margin-bottom: 3px;
  display: block;
}
.meaning-text {
  font-size: 19px;
  color: #4b5563;
  font-weight: normal;
  margin-top: 3px;
}

.audio-btn {
  background: transparent;
  border: none;
  cursor: pointer;
  font-size: 20px;
  margin-left: 8px;
  padding: 2px 8px;
  border-radius: 50%;
  transition: background-color 0.2s;
  vertical-align: middle;
}
.audio-btn:hover {
  background-color: #edf2f7;
}

.hint{color:#888; font-size:18px; text-align:center; margin-top:14px}
.controls{display:flex;gap:16px;justify-content:center;margin-top:22px}
button{
  border:0;border-radius:14px;padding:16px 26px;font-size:20px;
  cursor:pointer;background:#e9eef7;color:#233044;
}
button.primary{background:#2563eb;color:white}
button:hover{filter:brightness(.97)}
.extra{display:flex;justify-content:center;gap:10px;margin-top:14px}
.shuffle{background:#e9f8ef}

@media(max-width:600px){
 .app{padding-top:16px}.card{height:620px}
 .face{padding:18px 16px}
 .context-title{font-size:16px; margin-bottom:12px}
 .speaker-col{width:100px; font-size:16px}
 .speaker-col-front{width:100px; font-size:22px}
 .speech-col{font-size:24px}
 .speech-col-back{font-size:18px}
 .pinyin-block{font-size:15px;}
 .meaning-text{font-size:15px}
 .controls button{padding:12px 16px; font-size:16px}
}
</style>
</head>
<body>
<div class="app">
  <h1>🇨🇳 BÀI 1 - BÀI KHÓA</h1>

  <div class="progress" id="progress"></div>

  <div class="card-wrap" id="cardWrap" onclick="flipCard()">
    <div class="card" id="card">
      <div class="face front">
        <div class="card-content" id="frontContent"></div>
      </div>
      <div class="face back">
        <div class="card-content" id="backContent"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button onclick="event.stopPropagation();prevCard()">← Trước</button>
    <button class="primary" onclick="event.stopPropagation();flipCard()">Lật thẻ</button>
    <button onclick="event.stopPropagation();nextCard()">Tiếp →</button>
  </div>
  <div class="extra">
    <button class="shuffle" onclick="event.stopPropagation();shuffleCards()">🔀 Trộn thẻ</button>
  </div>
</div>

<script>
const originalCards = [
  {
    "frontContext": "BÀI KHÓA 1: Ngày đầu năm học, trong văn phòng, Vương Nhất Phi chào AI trợ giảng Tiểu Ngữ.",
    "frontLines": [
      { "speaker": "王一飞:", "speech": "AI小语，你好！" },
      { "speaker": "小语:", "speech": "王老师，您好！" }
    ],
    "backLines": [
      { "speaker": "王一飞:", "speech": "AI小语，你好！", "pinyin": "AI Xiǎoyǔ, nǐ hǎo!", "meaning": "AI Tiểu Ngữ, chào bạn!" },
      { "speaker": "小语:", "speech": "王老师，您好！", "pinyin": "Wáng lǎoshī, nín hǎo!", "meaning": "Thưa cô Vương, chào cô ạ!" }
    ]
  },
  {
    "frontContext": "BÀI KHÓA 2: Ngày đầu năm học, trong lớp học, các học sinh học cách chào hỏi.",
    "frontLines": [
      { "speaker": "王一飞:", "speech": "大家好！" },
      { "speaker": "学生们:", "speech": "老师，您好！" },
      { "speaker": "小语:", "speech": "你们好！" },
      { "speaker": "学生们:", "speech": "小语，你好！" }
    ],
    "backLines": [
      { "speaker": "王一飞:", "speech": "大家好！", "pinyin": "Dàjiā hǎo!", "meaning": "Chào mọi người!" },
      { "speaker": "学生们:", "speech": "老师，您好！", "pinyin": "Lǎoshī, nín hǎo!", "meaning": "Thưa cô, chào cô ạ!" },
      { "speaker": "小语:", "speech": "你们好！", "pinyin": "Nǐmen hǎo!", "meaning": "Chào các bạn!" },
      { "speaker": "学生们:", "speech": "小语，你好！", "pinyin": "Xiǎoyǔ, nǐ hǎo!", "meaning": "Tiểu Ngữ, chào bạn!" }
    ]
  },
  {
    "frontContext": "BÀI KHÓA 3: Ngày đầu năm học, trong lớp học, các học sinh học cách cảm ơn và tạm biệt.",
    "frontLines": [
      { "speaker": "学生们:", "speech": "谢谢！" },
      { "speaker": "小语:", "speech": "不客气！" },
      { "speaker": "王一飞:", "speech": "同学们，再见！" },
      { "speaker": "学生们:", "speech": "老师，再见！" }
    ],
    "backLines": [
      { "speaker": "学生们:", "speech": "谢谢！", "pinyin": "Xièxie!", "meaning": "Cảm ơn!" },
      { "speaker": "小语:", "speech": "不客气！", "pinyin": "Bù kèqi!", "meaning": "Không có gì!" },
      { "speaker": "王一飞:", "speech": "同学们，再见！", "pinyin": "Tóngxuémen, zàijiàn!", "meaning": "Tạm biệt các bạn học!" },
      { "speaker": "学生们:", "speech": "老师，再见！", "pinyin": "Lǎoshī, zàijiàn!", "meaning": "Tạm biệt cô!" }
    ]
  }
];

let cards = [...originalCards];
let index = 0;
let flipped = false;

function speakText(event, text) {
  event.stopPropagation();
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'zh-CN';
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
  } else {
    alert('Trình duyệt của bạn không hỗ trợ tính năng phát âm.');
  }
}

function render(){
  const c = cards[index];
  
  let frontHtml = `<div class="context-title">${c.frontContext}</div><table class="dialogue-table">`;
  c.frontLines.forEach(line => {
    frontHtml += `
      <tr>
        <td class="speaker-col-front">${line.speaker}</td>
        <td class="speech-col">
          ${line.speech}
          <button class="audio-btn" onclick="speakText(event, '${line.speech.replace(/'/g, "\\'")}')" title="Nghe phát âm">🔊</button>
        </td>
      </tr>`;
  });
  frontHtml += `</table>`;
  document.getElementById('frontContent').innerHTML = frontHtml;

  let backHtml = `<div class="context-title">${c.frontContext}</div><table class="dialogue-table">`;
  c.backLines.forEach(line => {
    backHtml += `
      <tr>
        <td class="speaker-col">${line.speaker}</td>
        <td class="speech-col-back">
          ${line.speech}
          <button class="audio-btn" onclick="speakText(event, '${line.speech.replace(/'/g, "\\'")}')" title="Nghe phát âm">🔊</button>
          <div class="pinyin-block">${line.pinyin}</div>
          <div class="meaning-text">${line.meaning}</div>
        </td>
      </tr>`;
  });
  backHtml += `</table>`;
  document.getElementById('backContent').innerHTML = backHtml;

  document.getElementById('progress').textContent = `Thẻ ${index+1} / ${cards.length}`;
  document.getElementById('card').classList.toggle('flipped', flipped);
}

function flipCard(){
  flipped = !flipped;
  document.getElementById('card').classList.toggle('flipped', flipped);
}

function nextCard(){
  index = (index + 1) % cards.length;
  flipped = false; render();
}

function prevCard(){
  index = (index - 1 + cards.length) % cards.length;
  flipped = false; render();
}

function shuffleCards(){
  for(let i=cards.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [cards[i],cards[j]]=[cards[j],cards[i]];
  }
  index=0; flipped=false; render();
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') nextCard();
  else if(e.key==='ArrowLeft') prevCard();
  else if(e.key===' ' || e.key==='Enter'){
    e.preventDefault();
    flipCard();
  }
});

render();
</script>
</body>
</html>
